global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: llm-gateway
    metrics_path: /metrics
    bearer_token: demo-metrics-key-change-me
    static_configs:
      - targets: [gateway:8000]
