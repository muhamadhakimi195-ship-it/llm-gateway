# These are fictional prices for testing accounting, NOT current vendor prices.
providers:
  primary:
    kind: compatible
    base_url: http://127.0.0.1:9001/v1
    base_url_env: MOCK_BASE_URL
    model: mock-primary
    input_usd_per_million: 5.0
    output_usd_per_million: 10.0
  secondary:
    kind: compatible
    base_url: http://127.0.0.1:9001/v1
    base_url_env: MOCK_BASE_URL
    model: mock-secondary
    input_usd_per_million: 5.0
    output_usd_per_million: 10.0
routes:
  balanced: [primary, secondary]
teams:
  demo:
    api_key_env: DEMO_TEAM_KEY
    policy:
      allowed_models: [balanced]
      requests_per_minute: 6000
      tokens_per_minute: 6000000
      daily_budget_microusd: 5000000
      system_prompt: "Answer concisely. Do not claim that mock outputs are generated by an LLM."
  analyst:
    api_key_env: ANALYST_TEAM_KEY
    policy:
      allowed_models: [balanced]
      requests_per_minute: 120
      tokens_per_minute: 100000
      daily_budget_microusd: 500000
provider_timeout_seconds: 10.0
request_deadline_seconds: 30.0
retry_count: 1
retry_base_seconds: 0.1
circuit_failure_threshold: 3
circuit_window_seconds: 30.0
circuit_cooldown_seconds: 5.0
interactive_concurrency: 32
batch_concurrency: 4
queue_timeout_seconds: 2.0
